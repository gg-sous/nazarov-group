name: nazarovgroup

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    image: ${IMAGE_PREFIX}/backend:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DOCS_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MEDIA_DIRECTORY: /app/media
      BOT_INTERNAL_URL: http://bot:8081
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  frontend:
    image: ${IMAGE_PREFIX}/frontend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  bot:
    image: ${IMAGE_PREFIX}/bot:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_HEALTH_PORT: 8081
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres_data:
  media_data:

networks:
  internal:
    driver: bridge
