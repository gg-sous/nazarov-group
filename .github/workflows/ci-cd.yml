name: CI and delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nazarovgroup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests alembic
      - run: pytest

  bot-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check app
      - run: python -m compileall -q app

  publish-images:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [frontend-quality, backend-quality, bot-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [frontend, backend, bot]
    steps:
      - uses: actions/checkout@v4
      - id: image
        name: Normalize image prefix
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_SITE_URL=${{ vars.PRODUCTION_URL || 'http://localhost' }}
          tags: |
            ${{ steps.image.outputs.prefix }}/${{ matrix.component }}:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}/${{ matrix.component }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy-production:
    if: vars.ENABLE_DEPLOY == 'true'
    needs: publish-images
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Upload deployment definition
        run: |
          tar -czf deployment.tgz docker-compose.prod.yml nginx
          scp deployment.tgz "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/nazarovgroup-deployment.tgz"
      - name: Authenticate VPS in GHCR
        run: |
          printf '%s' "${{ secrets.GHCR_PULL_TOKEN }}" | ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin"
      - name: Deploy immutable images
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p '${{ secrets.VPS_DEPLOY_PATH }}' && tar -xzf /tmp/nazarovgroup-deployment.tgz -C '${{ secrets.VPS_DEPLOY_PATH }}' && cd '${{ secrets.VPS_DEPLOY_PATH }}' && IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='${{ github.sha }}' docker compose -f docker-compose.prod.yml pull && IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='${{ github.sha }}' docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 180 --remove-orphans"
